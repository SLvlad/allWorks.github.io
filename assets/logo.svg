<svg width="248" height="56" viewBox="0 0 248 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mamino Ogrodzenia">
  <!--
    Znak Mamino: domek z czerwonym dachem + napis MAMINO OGRODZENIA.
    Odtworzony wg opisu z brand kit. Jeśli macie oryginalny plik znaku,
    wystarczy podmienić assets/logo.svg (odwołania w kodzie zostają).
  -->
  <!-- Domek -->
  <g>
    <!-- czerwony dach -->
    <path d="M24 6 L44 23 L4 23 Z" fill="#C0392B"/>
    <!-- korpus domu -->
    <rect x="9" y="23" width="30" height="25" rx="2" fill="#070707"/>
    <!-- drzwi (akcent CTA) -->
    <rect x="20" y="33" width="8" height="15" rx="1" fill="#E9762B"/>
  </g>
  <!-- Napis -->
  <text x="56" y="30" font-family="'Bebas Neue','Arial Narrow',sans-serif" font-size="30" font-weight="700" letter-spacing="1.5" fill="#070707">MAMINO</text>
  <text x="57" y="45" font-family="'Questrial','Arial',sans-serif" font-size="11" letter-spacing="4.5" fill="#6B6B66">OGRODZENIA</text>
</svg>
