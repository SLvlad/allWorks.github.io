[build]
  publish = "."
  command = ""

# Statyczna strona bez kroku budowania — Netlify wykrywa formularz "wycena"
# w mamino.html automatycznie dzięki atrybutowi data-netlify="true".
#
# Strona nie nazywa się index.html, więc pod "/" Netlify pokaże domyślny 404.
# Odkomentuj poniższy redirect, jeśli mamino.html ma być stroną główną:
# [[redirects]]
#   from = "/"
#   to = "/mamino.html"
#   status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
